<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eadfc2"/>
      <stop offset="100%" stop-color="#e0d1ac"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f2e2"/>
      <stop offset="100%" stop-color="#f3ebd6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- desk -->
  <rect width="1200" height="630" fill="url(#desk)"/>

  <!-- sheet behind (stacked copies) -->
  <rect x="72" y="66" width="1068" height="516" fill="#efe6cd" stroke="#4a3c26" stroke-opacity="0.25"/>
  <!-- main sheet -->
  <rect x="60" y="54" width="1068" height="516" fill="url(#sheet)" stroke="#4a3c26" stroke-opacity="0.4"/>

  <!-- classification band -->
  <rect x="60" y="54" width="1068" height="34" fill="#a4232b"/>
  <text x="594" y="77" fill="#f7f1e0" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="8" text-anchor="middle">DECLASSIFIED · PERSONNEL FILE · APPROVED FOR PUBLIC RELEASE</text>

  <!-- typed header -->
  <g font-family="'Courier New', Courier, monospace">
    <text x="104" y="140" fill="#6f6249" font-size="19" letter-spacing="3">FILE NO. RD-04-B-07 &#160;&#160;·&#160;&#160; RECORDS DIVISION</text>
    <text x="104" y="176" fill="#6f6249" font-size="19" letter-spacing="3">SUBJECT:</text>

    <text x="104" y="248" fill="#262017" font-size="64" font-weight="700" letter-spacing="2">INDU LOHITH</text>
    <text x="104" y="318" fill="#262017" font-size="64" font-weight="700" letter-spacing="2">NARISETTY</text>

    <text x="104" y="372" fill="#a4232b" font-size="26" font-weight="700" letter-spacing="2">AI DETECTION ENGINEER — SOC · IR</text>

    <text x="104" y="418" fill="#3a3224" font-size="20">Writes rules, chases alerts, automates triage.</text>

    <!-- evidence tags -->
    <g font-size="17">
      <g transform="translate(104,452)">
        <rect x="0" y="0" width="160" height="34" fill="none" stroke="#29538f" stroke-opacity="0.7"/>
        <text x="16" y="23" fill="#29538f">Splunk SPL</text>
      </g>
      <g transform="translate(278,452)">
        <rect x="0" y="0" width="180" height="34" fill="none" stroke="#29538f" stroke-opacity="0.7"/>
        <text x="16" y="23" fill="#29538f">Sentinel KQL</text>
      </g>
      <g transform="translate(472,452)">
        <rect x="0" y="0" width="190" height="34" fill="none" stroke="#a4232b" stroke-opacity="0.7"/>
        <text x="16" y="23" fill="#a4232b">MITRE ATT&amp;CK</text>
      </g>
      <g transform="translate(676,452)">
        <rect x="0" y="0" width="150" height="34" fill="none" stroke="#8d6110" stroke-opacity="0.7"/>
        <text x="16" y="23" fill="#8d6110">CrowdStrike</text>
      </g>
      <g transform="translate(840,452)">
        <rect x="0" y="0" width="90" height="34" fill="none" stroke="#8d6110" stroke-opacity="0.7"/>
        <text x="16" y="23" fill="#8d6110">AWS</text>
      </g>
    </g>

    <!-- ruled footer -->
    <line x1="104" y1="520" x2="1084" y2="520" stroke="#4a3c26" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <text x="104" y="548" fill="#29538f" font-size="18" letter-spacing="2">indulohithnarisetty.com</text>
    <text x="1084" y="548" fill="#6f6249" font-size="15" letter-spacing="2" text-anchor="end">EXHIBITS: DETECTIONS · PROJECTS · TRIAGE</text>
  </g>

  <!-- rubber stamp -->
  <g transform="translate(830,150) rotate(-9)" opacity="0.85">
    <rect x="0" y="0" width="290" height="86" fill="none" stroke="#a4232b" stroke-width="4"/>
    <rect x="7" y="7" width="276" height="72" fill="none" stroke="#a4232b" stroke-width="2"/>
    <text x="145" y="40" fill="#a4232b" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" letter-spacing="4" text-anchor="middle">APPROVED FOR</text>
    <text x="145" y="68" fill="#a4232b" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" letter-spacing="4" text-anchor="middle">PUBLIC RELEASE</text>
  </g>

  <!-- paper grain -->
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5" fill="none"/>
</svg>
